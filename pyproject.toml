[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnifall"
version = "0.1.0"
description = "Companion package for the OmniFall fall detection dataset"
license = "Apache-2.0"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    { name = "David Schneider", email = "david.schneider@kit.edu" },
]
keywords = ["fall-detection", "dataset", "huggingface", "activity-recognition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "datasets>=3.0.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
video = [
    "torch>=2.0.0",
    "av>=10.0.0",
    "numpy",
    "torchvision",
    "transformers>=4.30.0",
]

[project.urls]
Homepage = "https://huggingface.co/datasets/simplexsigil2/omnifall"
Repository = "https://github.com/simplexsigil/omnifall"

[project.scripts]
omnifall = "omnifall.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnifall"]
